<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>分类标签 · 盛京心理后台</title>
<link rel="stylesheet" href="../assets/css/base.css"/>
<link rel="stylesheet" href="../assets/css/components.css"/>
<link rel="stylesheet" href="../assets/css/layout.css"/>
<style>
.cat-item{display:flex;align-items:center;gap:12px;padding:12px 14px;
  border-radius:14px;border:1px solid var(--bdr);background:var(--surf-alt);
  transition:var(--tb)}
.cat-item:hover{border-color:var(--cp-sub);background:rgba(26,127,160,.03)}
.drag-handle{color:var(--tx3);cursor:grab;font-size:16px;flex-shrink:0}
.cat-swatch{width:14px;height:14px;border-radius:4px;flex-shrink:0}
.tag-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;
  border-radius:var(--rfull);background:var(--surf-alt);border:1px solid var(--bdr);
  font-size:13px;font-weight:500;cursor:default}
.tag-chip .del-tag{font-size:12px;color:var(--tx3);cursor:pointer;line-height:1}
.tag-chip .del-tag:hover{color:var(--err)}
.add-inline{display:flex;gap:8px;align-items:center}
.add-inline input{padding:8px 12px;border:1.5px solid var(--bdr-s);border-radius:var(--rfull);
  font-size:13px;min-width:140px;outline:none;background:var(--surf)}
.add-inline input:focus{border-color:var(--cp)}
</style>
</head>
<body>
<div class="adm-shell">
  <aside class="adm-sb" id="adm-sb"></aside>
  <main class="adm-main">

    <div class="page-hd">
      <div>
        <div class="page-bc"><a href="./articles.html">文章管理</a><span>/</span><span>分类 & 标签</span></div>
        <h1 class="page-title">分类与标签管理</h1>
        <p class="page-sub">动态维护科普文章的分类体系与标签库，支持拖拽排序。</p>
      </div>
    </div>

    <div class="two-col-eq">

      <!-- Category Panel -->
      <div class="card card-p">
        <div class="sec-hd" style="margin-bottom:16px">
          <div><div class="sec-eye">内容分类</div><h3 class="sec-title" style="font-size:17px">文章分类</h3></div>
          <button class="btn btn-p btn-sm" id="add-cat-btn">＋ 添加分类</button>
        </div>

        <div id="add-cat-form" class="hidden mb4">
          <div class="add-inline">
            <input id="new-cat-input" placeholder="输入分类名称…" maxlength="12"/>
            <button class="btn btn-p btn-sm" onclick="addCat()">添加</button>
            <button class="btn btn-o btn-sm" onclick="toggleAddCat()">取消</button>
          </div>
        </div>

        <div id="cat-list" style="display:grid;gap:8px"></div>
      </div>

      <!-- Tag Panel -->
      <div class="card card-p">
        <div class="sec-hd" style="margin-bottom:14px">
          <div><div class="sec-eye">内容标签</div><h3 class="sec-title" style="font-size:17px">标签库</h3></div>
          <button class="btn btn-p btn-sm" id="add-tag-btn">＋ 添加标签</button>
        </div>

        <div id="add-tag-form" class="hidden mb4">
          <div class="add-inline">
            <input id="new-tag-input" placeholder="输入标签名称…" maxlength="10"/>
            <button class="btn btn-p btn-sm" onclick="addTag()">添加</button>
            <button class="btn btn-o btn-sm" onclick="toggleAddTag()">取消</button>
          </div>
        </div>

        <div class="search-wrap mb4">
          <span class="s-icon">🔍</span>
          <input class="input" id="tag-search" placeholder="搜索标签…"/>
        </div>

        <div id="tag-cloud" style="display:flex;flex-wrap:wrap;gap:8px"></div>
        <div class="xs muted mt4" id="tag-count"></div>
      </div>
    </div>

    <!-- Usage Stats -->
    <div class="card card-p adm-sec">
      <div class="sec-hd" style="margin-bottom:16px"><div><div class="sec-eye">使用统计</div><h3 class="sec-title" style="font-size:17px">各分类文章数量</h3></div></div>
      <div id="cat-stats"></div>
    </div>

  </main>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/utils.js"></script>
<script>
Utils.initAdminSidebar('categories');

const catColors = ['#1a7fa0','#4bbfad','#2a9d73','#d97706','#9b59b6','#e74c3c'];
let cats = DATA.categories.slice(1).map((c,i) => ({
  id:i+1, name:c, color:catColors[i%catColors.length],
  count: DATA.articles.filter(a=>a.category===c).length
}));
let tags = [...DATA.tags];

function renderCats() {
  document.getElementById('cat-list').innerHTML = cats.map((c,i) => `
    <div class="cat-item" draggable="true">
      <span class="drag-handle">⠿</span>
      <span class="cat-swatch" style="background:${c.color}"></span>
      <span class="g1 w6 sm">${c.name}</span>
      <span class="badge badge-cp">${c.count}篇</span>
      <button class="btn btn-icon btn-sm btn-g" title="编辑" onclick="editCat(${c.id})">✏</button>
      <button class="btn btn-icon btn-sm btn-d" title="删除" onclick="deleteCat(${c.id})">✕</button>
    </div>`).join('');

  // Stats
  document.getElementById('cat-stats').innerHTML = cats.map(c => `
    <div class="prog-row">
      <div class="prog-info"><div class="prog-name">${c.name}</div><div class="prog-cnt">${c.count}篇</div></div>
      <div class="prog-track"><div class="prog-fill" style="width:${Math.round(c.count/Math.max(1,...cats.map(x=>x.count))*100)}%;background:${c.color}"></div></div>
      <div class="prog-pct">${c.count}</div>
    </div>`).join('');
}

function renderTags(kw='') {
  const filtered = tags.filter(t => !kw || t.includes(kw));
  document.getElementById('tag-cloud').innerHTML = filtered.map(t => `
    <div class="tag-chip">
      <span class="tag" style="pointer-events:none">${t}</span>
      <span class="del-tag" onclick="deleteTag('${t}')" title="删除标签">✕</span>
    </div>`).join('');
  document.getElementById('tag-count').textContent = `共 ${tags.length} 个标签，显示 ${filtered.length} 个`;
}

function toggleAddCat() {
  const f = document.getElementById('add-cat-form');
  f.classList.toggle('hidden');
  if (!f.classList.contains('hidden')) document.getElementById('new-cat-input').focus();
}
function toggleAddTag() {
  const f = document.getElementById('add-tag-form');
  f.classList.toggle('hidden');
  if (!f.classList.contains('hidden')) document.getElementById('new-tag-input').focus();
}
window.toggleAddCat = toggleAddCat;
window.toggleAddTag = toggleAddTag;

function addCat() {
  const v = document.getElementById('new-cat-input').value.trim();
  if (!v) { Utils.toast('请输入分类名称'); return; }
  if (cats.some(c => c.name === v)) { Utils.toast('分类名称已存在'); return; }
  cats.push({ id: Date.now(), name:v, color:catColors[cats.length%catColors.length], count:0 });
  document.getElementById('new-cat-input').value = '';
  document.getElementById('add-cat-form').classList.add('hidden');
  renderCats();
  Utils.toast('分类"' + v + '"已添加');
}
window.addCat = addCat;

function editCat(id) {
  const c = cats.find(x => x.id === id);
  const newName = prompt('修改分类名称：', c.name);
  if (newName && newName.trim() && newName.trim() !== c.name) {
    c.name = newName.trim();
    renderCats();
    Utils.toast('分类名称已更新');
  }
}
window.editCat = editCat;

function deleteCat(id) {
  const c = cats.find(x => x.id === id);
  if (!confirm(`确认删除分类「${c.name}」？该分类下 ${c.count} 篇文章将移至未分类。`)) return;
  cats = cats.filter(x => x.id !== id);
  renderCats();
  Utils.toast('分类已删除');
}
window.deleteCat = deleteCat;

function addTag() {
  const v = document.getElementById('new-tag-input').value.trim();
  if (!v) { Utils.toast('请输入标签名称'); return; }
  if (tags.includes(v)) { Utils.toast('标签已存在'); return; }
  tags.push(v);
  document.getElementById('new-tag-input').value = '';
  document.getElementById('add-tag-form').classList.add('hidden');
  renderTags();
  Utils.toast('标签"' + v + '"已添加');
}
window.addTag = addTag;

function deleteTag(t) {
  if (!confirm('确认删除标签「'+t+'」？')) return;
  tags = tags.filter(x => x !== t);
  renderTags(document.getElementById('tag-search').value);
  Utils.toast('标签已删除');
}
window.deleteTag = deleteTag;

document.getElementById('tag-search').oninput = function(){ renderTags(this.value.trim()); };
document.getElementById('add-cat-btn').onclick = toggleAddCat;
document.getElementById('add-tag-btn').onclick = toggleAddTag;

document.getElementById('new-cat-input').onkeydown = e => { if(e.key==='Enter') addCat(); };
document.getElementById('new-tag-input').onkeydown = e => { if(e.key==='Enter') addTag(); };

renderCats();
renderTags();
</script>
</body>
</html>
